global_costmap:
  global_frame: map
  robot_base_frame: turtle_v2/base_footprint

  width: 20
  height: 20

  robot_radius: 0.3

  update_frequency: 10.0
  publish_frequency: 10.0
  transform_tolerance: 0.2

  static_map: false
  rolling_window: true

  plugins:
    - name: static_layer
      type: "costmap_2d::StaticLayer"
      map_topic: "/map"  # Ensure it subscribes to the correct topic
    - name: obstacle_layer
      type: "costmap_2d::ObstacleLayer"
    - name: inflation_layer
      type: "costmap_2d::InflationLayer"

 
